<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperMart | Movimentações</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">

  <script src="js/estoque.js" defer></script>
  <script src="js/app.js" defer></script>
</head>

<body>
  <header class="header">
    <div class="marca">
      <img src="logo.png" alt="SuperMart">

      <div>
        <p class="subtitulo">Controle de estoque</p>
      </div>
    </div>
  </header>

  <div id="menu_lateral">
    <button class="btn_lateral" onclick="window.location.href='visao_geral.html'">
      Estoque
    </button>
    <button class="btn_lateral ativo" onclick="window.location.href='movimentacoes.html'">
      Movimentações
    </button>
  </div>

  <main>
    <section class="tabelas_movimentacoes">

      <div>
        <h2 id="título_estoq">Entradas de produtos</h2>

        <div id="buscar">
          <input type="text" placeholder="Buscar por nome">
          <select id="categorias">
            <option>Todas as categorias</option>
          </select>
        </div>

        <table id="tabela_entradas">
          <thead>
            <tr>
              <th>Tipo de entrada</th>
              <th>Produto</th>
              <th>Categoria</th>
              <th>Preço</th>
              <th>Qtd.</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody>
          </tbody>
        </table>
      </div>

      <div>
        <h2 id="título_saidas">Saídas de produtos</h2>

        <div id="buscar_saidas">
          <input type="text" placeholder="Buscar por nome">
          <select id="categorias_saidas">
            <option>Todas as categorias</option>
          </select>
        </div>

        <table id="tabela_saidas">
          <thead>
            <tr>
              <th>Tipo de saída</th>
              <th>Produto</th>
              <th>Categoria</th>
              <th>Preço</th>
              <th>Qtd.</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody>
          </tbody>
        </table>
      </div>

    </section>
  </main>

  <footer class="footer">
    <p>SuperMart &middot; Projeto acadêmico de Programação Web Front-End</p>
  </footer>

</body>
</html>
