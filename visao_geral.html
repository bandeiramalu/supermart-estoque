<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperMart | Controle de estoque</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <header class="header">
    <div class="marca">
      <img src="docs/logo.png" alt="SuperMart">
      <p class="subtitulo">Controle de estoque</p>
    </div>
  </header>

  <div id="menu_lateral">
    <button class="btn_lateral ativo" onclick="window.location.href='visao_geral.html'">
      Estoque
    </button>
    <button class="btn_lateral" onclick="window.location.href='movimentacoes.html'">
      Movimentações
    </button>
  </div>

  <main>
    <div>
      <section class="indicadores-resumo">
        <div class="indicadores">
          <p>Produtos cadastrados</p>
          <h2 id="prod_total">0</h2>
        </div>
        <div class="indicadores indica-valor">
          <p>Valor em estoque</p>
          <h2 id="valor_estoque">R$ 0,00</h2>
        </div>
        <div class="indicadores indica-baixo">
          <p>Itens com estoque baixo</p>
          <h2 id="estoque_baixo">0</h2>
        </div>
      </section>

      <section id="cadastro">
        <h3>Cadastrar produto</h3>
        <form id="cadastro_prod">
          <div>
            <div>
              <label for="nome_prod">Nome do produto</label>
              <input type="text" id="nome_prod" class="cads" required>
            </div>
            <div>
              <label for="categoria_prod">Categoria</label>
              <select id="categoria_prod" class="cads" required>
                <option value="" disabled selected>Escolha uma categoria</option>
                <option>Mercearia</option>
                <option>Hortifrúti</option>
                <option>Açougue e Peixaria</option>
                <option>Frios e Laticínios</option>
                <option>Congelados</option>
                <option>Padaria e Confeitaria</option>
                <option>Bebidas</option>
                <option>Limpeza</option>
                <option>Higiene e Perfumaria</option>
                <option>Bazar e Pet</option>
                <option>Eletrônicos</option>
              </select>
            </div>
            <div>
              <label for="preco_prod">Preço (R$)</label>
              <input type="number" step="0.01" min="0" id="preco_prod" class="cads" required>
            </div>
            <div>
              <label for="quant_prod">Quantidade em estoque</label>
              <input type="number" min="0" id="quant_prod" class="cads" required>
            </div>
            <div>
              <label for="min_prod">Estoque mínimo</label>
              <input type="number" min="0" id="min_prod" class="cads" required>
            </div>
            <div>
              <button type="submit" class="btn67" id="btn67_salva">Salvar produto</button>
              <button type="reset" class="btn67" id="btn67_limpa">Limpar</button>
            </div>
          </div>
        </form>
      </section>

      <section>
        <h3>Produtos em estoque</h3>

        <div id="buscar">
          <label class="campo-oculto" for="busca_nome">Buscar por nome</label>
          <input type="search" id="busca_nome" placeholder="Buscar por nome">
          <label class="campo-oculto" for="categorias">Categoria</label>
          <select id="categorias">
            <option>Todas as categorias</option>
            <option>Mercearia</option>
            <option>Hortifrúti</option>
            <option>Açougue e Peixaria</option>
            <option>Frios e Laticínios</option>
            <option>Congelados</option>
            <option>Padaria e Confeitaria</option>
            <option>Bebidas</option>
            <option>Limpeza</option>
            <option>Higiene e Perfumaria</option>
            <option>Bazar e Pet</option>
            <option>Eletrônicos</option>
          </select>
        </div>

        <table id="tabela" class="tabela-dados">
          <thead>
            <tr>
              <th>Produto</th>
              <th>Categoria</th>
              <th>Preço (R$)</th>
              <th>Qtd.</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>
    </div>
  </main>

  <footer class="footer">
    <p>SuperMart &middot; Projeto acadêmico de Programação Web Front-End</p>
  </footer>
</body>
</html>
