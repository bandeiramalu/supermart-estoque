<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperMart | Controle de estoque</title>

  <link rel="stylesheet" href="css/style.css">

  <script src="js/script.js" defer></script>
</head>
<body>
  <!-- Menu Lateral -->
  <div id="menu_lateral">
    <button class="btn_lateral" onclick="window.location.href='visao_geral.html'">
      <span>📦</span> Visão geral
    </button>
    <button class="btn_lateral" onclick="window.location.href='movimentacoes.html'">
      <span>🚚</span> Movimentações
    </button>
  </div>

  <!-- ===================== CABEÇALHO ===================== -->
  <header class="header">
    <h1 class="logo">SuperMart</h1>
    <p class="subtitulo">Controle de estoque</p>
  </header>

  <main>
    <!-- COLOCAR AQUI A PAGINA PRINCIPAL -->  
    <div>
      <!-- indicadores (aqueles 3 quadrados com indicadores, como tá lá no figma)-->
      <section id="3_indicadores">
        <div class="indicadores" id="indica_1">
          <p>Produtos cadastrados</p>
          <h2>10</h2>
        </div>
        <div class="indicadores" id="indica_2">
          <p>Valor em estoque</p>
          <h2>R$ 4.213,50</h2>
        </div>
        <div class="indicadores" id="indica_3">
          <p>Itens com estoque baixo</p>
          <h2>3</h2>
        </div>
      </section>

      <!-- formulário do cadastro (n tem muito oq explicar disso) -->
      <section id="cadastro">
        <h3 id="titulo_cd">Cadastrar produto</h3>
        <form id="cadastro_prod">
          <div>
            <div>
              <label>Nome do produto</label>
              <input type="text" id="nome_prod" class="cads">
            </div>
            <div>
              <label>Categoria</label> <!-- acho q aqui deveria ser um select pra escolher as categorias já cadastradas. -M -->
              <input type="text" id="categoria_prod" class="cads">
            </div>
            <div>
              <label>Preço (R$)</label>
              <input type="number" step="0.1" min="0" id="preco_prod" class="cads">
            </div>
            <div>
              <label>Quantidade</label>
              <input type="number" min="0" id="quant_prod" class="cads">
            </div>
            <div>
              <label>Estoque mínimo</label>
              <input type="number" min="0" id="min_prod" class="cads">
            </div>
            <div>
              <button type="submit" class="btn67" id="btn67_salva">Salvar produto</button>
              <button type="reset" class="btn67" id="btn67_limpa">Limpar</button>
            </div>
          </div>
        </form>
      </section>

      <!-- tabela dos produtos -->
      <section>
        <h3 id="título_estoq">Produtos em estoque</h3>
        
        <div id="buscar">
          <input type="text" placeholder="Buscar por nome">
          <select id="categorias">
            <option>Todas as categorias</option> <!-- adicionar as categorias dos produtos. -M -->
            <option>Bebidas</option>
          </select>
        </div>

        <table id="tabela">
          <thead>
            <tr>
              <th>Produto</th>
              <th>Categoria</th>
              <th>Preço (R$)</th>
              <th>Qtd.</th>
              <th>Estoque Min.</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody>
            <!-- itens cadastrados vêm pra cá. -M -->
          </tbody>
        </table>
      </section>
    </div>
  </main>

  <footer class="footer">
    <p>SuperMart &middot; Projeto acadêmico de Programação Web Front-End</p>
  </footer>

</body>
</html>
